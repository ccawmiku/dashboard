name: Validate and publish
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: dashboard:test
      - name: Test container with a deterministic NTP source
        run: |
          docker network create dashboard-test
          docker run -d --name ntp-fixture --network dashboard-test -v "$PWD/scripts/ntp-fixture.mjs:/fixture.mjs:ro" node:24.15.0-bookworm-slim node /fixture.mjs
          docker run -d --name dashboard --network dashboard-test -p 127.0.0.1:3000:3000 -e NTP_SERVERS=ntp-fixture dashboard:test
          node scripts/container-smoke.mjs
          test "$(docker exec dashboard id -u)" != "0"
      - name: Container diagnostics
        if: always()
        run: docker logs dashboard || true
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/ccawmiku/dashboard:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/ccawmiku/dashboard
            org.opencontainers.image.version=${{ github.ref_name }}
